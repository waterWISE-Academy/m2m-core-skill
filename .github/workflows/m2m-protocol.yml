name: M2M Agentic Protocol Engine (Hub)

on:
  workflow_call:
    inputs:
      m2m_version:
        required: false
        type: string
        default: '2.3'
        description: 'M2M Protocol Version'
      worker_agent:
        required: false
        type: string
        default: 'antigravity'
        description: '指定負責實作的 Agent (e.g., antigravity, opencode, jules_solo)'
    secrets:
      ORG_GITHUB_TOKEN:
        required: true

jobs:
  m2m-issue-listener:
    name: 🎧 Listen for /execute in Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, '/execute')
    steps:
      - name: Acknowledge Command
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ORG_GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const user = context.payload.comment.user.login;
            const worker_agent = "${{ inputs.worker_agent }}";

            console.log(`Received /execute command from ${user} on issue #${issue_number}`);

            await github.rest.issues.addLabels({
              owner: owner,
              repo: repo,
              issue_number: issue_number,
              labels: ['m2m:plan-ready']
            });

            let worker_msg = `即將喚醒 @${worker_agent} 進行實作，請稍候。`;
            if (worker_agent === 'jules_solo') {
              worker_msg = `進入單兵模式，Jules 將全權負責架構與實作，請稍候。`;
            }

            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: issue_number,
              body: `🤖 **[Jules (System 2 總指揮中心)]** 收到老闆指令 (由 @${user} 觸發)。\n\n已鎖定計畫書，正在動態載入全域藍圖 (docs/learnings/*) 並建立技術架構...\n\n${worker_msg}`
            });

  m2m-ci-gatekeeper:
    name: 🛡️ CI Validation & Security Gate (Phase 1)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Phase 1.1 - Secret Scanning (grep fallback)
        id: secret_scan
        run: |
          echo "Scanning for potential secrets in the diff..."
          if git diff origin/main...HEAD -U0 | grep -iE "(api_key|apikey|secret|password|token)\s*=\s*[\"'][^\"']+[\"']"; then
            echo "::error::🚨 Security Alert: 偵測到疑似明文憑證外洩！(Secret Scanning Failed)"
            exit 1
          fi
          echo "✅ Secret Scanning Passed."

      - name: Phase 1.2 - High-Risk & DB Migration Check
        id: risk_check
        run: |
          echo "Checking for high risk changes..."
          if git diff origin/main...HEAD --name-only | grep -E "(\.env|config/|\.github/workflows/|^db/migrations/)"; then
            echo "::warning::High-risk changes detected. Requires Human Verification (Solo-Maintainer Clause or Tech Lead)."
            echo "is_high_risk=true" >> $GITHUB_OUTPUT
          else
            echo "is_high_risk=false" >> $GITHUB_OUTPUT
          fi

      - name: Phase 1.3 - Verify Auth Spoofing (For Solo-Maintainer)
        if: steps.risk_check.outputs.is_high_risk == 'true'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ORG_GITHUB_TOKEN }}
          script: |
            const pr_creator = context.payload.pull_request.user.login;
            const actor = context.actor;

            console.log(`PR created by: ${pr_creator}, Approver/Actor: ${actor}`);

            // In a real Spoke, we would check if actor is in CODEOWNERS.
            // For Solo-Maintainer, we at least verify the actor is NOT the bot itself.
            const bot_names = ['antigravity', 'opencode', 'jules_solo', 'github-actions[bot]', 'jules'];

            if (bot_names.includes(actor)) {
              core.setFailed("🚨 Auth Spoofing Prevented: Bots are not allowed to self-approve high-risk changes. Require human intervention.");
            } else {
              console.log("✅ Human actor verified.");
            }

      - name: Phase 1.4 - Blueprint Sync Check
        id: blueprint_sync
        run: |
          echo "Checking if Blueprint Sync is completed..."
          if ! git diff origin/main...HEAD --name-only | grep -E "^docs/learnings/.*\.md$"; then
             echo "::warning::⚠️ 尚未偵測到 docs/learnings/ 下的更新。請確認本次任務是否有可寫入的新教訓。"
          else
             echo "✅ Blueprint Sync committed."
          fi

      - name: Phase 1.5 - Git Dry-Run Pre-Merge Check
        id: dry_run
        run: |
          echo "Executing Git Dry-Run to prevent merge conflicts..."
          git fetch origin main
          git checkout -b dry-run-branch HEAD
          if ! git merge origin/main --no-commit; then
            echo "::error::🚨 Merge Conflict Detected during Dry-Run!"
            git merge --abort
            exit 1
          fi
          echo "✅ Git Dry-Run Passed (No Conflicts)."

      - name: Trigger Auto-Healing (If Failed)
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ORG_GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const worker_agent = "${{ inputs.worker_agent }}";

            let mention = `@${worker_agent}`;
            if (worker_agent === 'jules_solo') mention = `@jules`;

            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: issue_number,
              body: `⚠️ **[CI 總指揮中心攔截]** 測試或安全掃描失敗。\n已標記 \`agent-fix-required\`。請 ${mention} 讀取 Log 並於背景自動修正。`
            });

            await github.rest.issues.addLabels({
              owner: owner,
              repo: repo,
              issue_number: issue_number,
              labels: ['agent-fix-required']
            });
